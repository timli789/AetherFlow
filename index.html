<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="A lightweight and clean version of the free association word practice application. Focus purely on the flow of your thoughts.">
  <!-- PWA & Apple Integration -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AetherFlow">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>AetherFlow Lite - Free Association Practice</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- App Stylesheet (Reuses main styling) -->
  <link rel="stylesheet" href="style.css">
  <style>
    /* Custom modifications for Lite view layout */
    .lite-setup-container {
      max-width: 480px;
      margin: 40px auto;
    }
  </style>
</head>
<body>
  <!-- Ambient background glow elements -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <div class="ambient-glow glow-3"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-logo">
          <i data-lucide="brain" class="logo-icon"></i>
        </div>
        <div class="brand-text">
          <h1>AetherFlow Lite</h1>
          <p>Stream of Consciousness</p>
        </div>
      </div>
    </header>

    <!-- VIEWS CONTAINER -->
    <main class="views-container">
      
      <!-- 1. SETUP VIEW (DASHBOARD) -->
      <section id="dashboard-view" class="app-view active">
        <div class="lite-setup-container glass-panel">
          <h2 class="section-title" style="justify-content: center; margin-bottom: 24px;">
            <i data-lucide="sliders"></i> 
            <span>Select Practice Time</span>
          </h2>
          <form id="config-form" class="config-form">
            <div class="form-group">
              <div class="duration-selector" style="grid-template-columns: repeat(5, 1fr);">
                <button type="button" class="duration-btn" data-value="10">10s</button>
                <button type="button" class="duration-btn active" data-value="15">15s</button>
                <button type="button" class="duration-btn" data-value="20">20s</button>
                <button type="button" class="duration-btn" data-value="25">25s</button>
                <button type="button" class="duration-btn" data-value="30">30s</button>
              </div>
              <input type="hidden" id="duration-input" value="15">
            </div>

            <button type="submit" class="primary-btn start-btn" style="width: 100%; margin-top: 16px;">
              <span>Begin Session</span>
              <i data-lucide="play"></i>
            </button>
          </form>
        </div>
      </section>

      <!-- 2. PRACTICE VIEW -->
      <section id="practice-view" class="app-view">
        <div class="practice-container glass-panel" style="justify-content: center; min-height: 400px; padding: 40px 28px;">
          <!-- Session Header -->
          <div class="practice-header">
            <button id="abort-practice-btn" class="icon-button danger-hover" title="Quit Practice">
              <i data-lucide="x"></i>
            </button>
            <div class="timer-display" id="timer-display-wrapper">
              <div class="timer-ring-svg-container">
                <svg class="timer-ring" width="80" height="80">
                  <circle class="timer-ring-bg" stroke="rgba(255,255,255,0.05)" stroke-width="4" fill="transparent" r="36" cx="40" cy="40"/>
                  <circle id="timer-ring-progress" class="timer-ring-progress" stroke="var(--color-primary)" stroke-width="4" fill="transparent" r="36" cx="40" cy="40"/>
                </svg>
              </div>
              <span id="timer-text" class="timer-text">15</span>
            </div>
          </div>

          <!-- Prompt Word Display -->
          <div class="prompt-section" style="margin: 60px 0;">
            <span class="prompt-label">Associate in your mind from</span>
            <h2 id="prompt-word" class="prompt-word" style="font-size: 4.5rem; animation: feedWordSpawn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.2) forwards;">Resonance</h2>
          </div>
        </div>
      </section>

      <!-- 3. RESULTS VIEW -->
      <section id="results-view" class="app-view">
        <div class="results-container" style="max-width: 600px;">
          
          <!-- Summary Header -->
          <div class="results-summary-card glass-panel">
            <div class="results-badge"><i data-lucide="brain"></i> Session Complete</div>
            <h2 class="results-title">Flow Complete!</h2>
            <p class="results-subtitle">You completed a mental free association session.</p>
            
            <div class="results-stats-grid" style="grid-template-columns: repeat(2, 1fr);">
              <div class="res-stat-card">
                <span class="res-stat-val" id="results-duration">0s</span>
                <span class="res-stat-lbl">Practice Time</span>
              </div>
              <div class="res-stat-card">
                <span class="res-stat-val" id="results-prompt-word" style="font-size: 1.5rem; word-break: break-all;">Resonance</span>
                <span class="res-stat-lbl">Prompt Noun</span>
              </div>
            </div>
          </div>

          <div class="results-actions" style="margin-top: 24px; justify-content: center;">
            <button id="retry-btn" class="primary-btn">
              <i data-lucide="rotate-ccw"></i>
              <span>Practice Again</span>
            </button>
            <button id="dashboard-btn" class="secondary-btn">
              <i data-lucide="arrow-left"></i>
              <span>Back to Setup</span>
            </button>
          </div>

        </div>
      </section>

    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>&copy; 2026 AetherFlow Lite. No tracking. Pure flow.</p>
    </footer>
  </div>

  <!-- App Logic script -->
  <script src="app.js"></script>
  <!-- Service Worker registration for offline support -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker registered successfully!', reg.scope))
          .catch(err => console.log('Service Worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
